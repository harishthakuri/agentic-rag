name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1" # fail if uv.lock is out of date instead of silently re-resolving
  TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken

jobs:
  quality:
    name: Lint, types, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Mypy (strict)
        run: uv run mypy app tests evals
      - name: Clean Architecture import contracts
        run: uv run lint-imports
      - name: UI JavaScript syntax
        run: node --check app/presentation/web/static/app.js

  unit:
    name: Unit and e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: .cache/tiktoken
          key: tiktoken-o200k_base
      - run: uv sync
      - run: uv run pytest -m "not integration and not live"

  integration:
    name: Integration tests (pgvector in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: .cache/tiktoken
          key: tiktoken-o200k_base
      - run: uv sync
      - run: uv run pytest -m integration

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: agentic-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
