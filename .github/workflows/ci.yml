name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (tags can be moved; SHAs can't). Dependabot updates them.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1" # fail if uv.lock is out of date instead of silently re-resolving
  TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken

jobs:
  quality:
    name: Lint, types, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Mypy (strict)
        run: uv run mypy app tests evals
      - name: Clean Architecture import contracts
        run: uv run lint-imports
      - name: UI JavaScript syntax
        run: node --check app/presentation/web/static/app.js

  unit:
    name: Unit and e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/tiktoken
          key: tiktoken-o200k_base
      - run: uv sync
      - run: uv run pytest -m "not integration and not live"

  integration:
    name: Integration tests (pgvector in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/tiktoken
          key: tiktoken-o200k_base
      - run: uv sync
      - run: uv run pytest -m integration

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: agentic-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
