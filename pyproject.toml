[project]
name = "simple-rag"
version = "0.1.0"
description = "Retrieval-Augmented Generation with agentic search, built on Clean Architecture (FastAPI, PostgreSQL + pgvector, Ollama/OpenAI)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
]

# ---------------------------------------------------------------------------
# Ruff: linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "S",        # bandit (security)
    "PTH",      # prefer pathlib
    "TC",       # type-checking imports
]
ignore = ["TC001", "TC002", "TC003"]  # FastAPI/Pydantic need runtime type imports

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------------------------------------------------------------------------
# Mypy: strict everywhere except migrations
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker (testcontainers + pgvector)",
    "live: calls real Ollama/OpenAI models; opt-in with -m live",
]
addopts = "-ra --strict-markers -m 'not live'"

# ---------------------------------------------------------------------------
# Import Linter: enforces the Clean Architecture dependency rule
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: outer layers depend on inner layers only"
type = "layers"
layers = [
    "app.presentation",
    "app.bootstrap",
    "app.infrastructure",
    "app.application",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure Python (no frameworks, no app.core)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.core", "fastapi", "starlette", "sqlalchemy", "pydantic_settings", "openai", "structlog"]

[[tool.importlinter.contracts]]
name = "Application does not depend on frameworks or drivers"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.core", "fastapi", "starlette", "sqlalchemy", "openai"]

[[tool.importlinter.contracts]]
name = "Presentation reaches infrastructure only through the composition root"
type = "forbidden"
source_modules = ["app.presentation"]
forbidden_modules = ["app.infrastructure", "sqlalchemy"]
allow_indirect_imports = true  # going through app.bootstrap is the intended path
